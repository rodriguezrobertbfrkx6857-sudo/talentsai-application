<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#10131b"/>
  <path d="M80 144H1520M80 758H1520" stroke="#2b3445" stroke-width="2"/>
  <text x="80" y="80" fill="#7da0ff" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">EVALUATION FLOW / SEEK EVIDENCE BEFORE DECISION</text>
  <text x="80" y="122" fill="#f7f8fb" font-family="Arial, sans-serif" font-size="40" font-weight="700">The answer is only one stage in the system.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80,270)">
      <circle cx="72" cy="72" r="72" fill="#171d29" stroke="#52617a" stroke-width="2"/>
      <text x="44" y="62" fill="#7da0ff" font-size="18" font-weight="700">01</text>
      <text x="26" y="94" fill="#f7f8fb" font-size="18" font-weight="700">TASK</text>
      <text x="0" y="200" fill="#b8c1cf" font-size="16">goal + constraints</text>
    </g>
    <path d="M230 342H310" stroke="#7da0ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(320,270)">
      <circle cx="72" cy="72" r="72" fill="#171d29" stroke="#52617a" stroke-width="2"/>
      <text x="44" y="62" fill="#7da0ff" font-size="18" font-weight="700">02</text>
      <text x="10" y="94" fill="#f7f8fb" font-size="18" font-weight="700">RESPONSE</text>
      <text x="-16" y="200" fill="#b8c1cf" font-size="16">untrusted answer</text>
    </g>
    <path d="M470 342H550" stroke="#7da0ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(560,270)">
      <circle cx="72" cy="72" r="72" fill="#2457ff" stroke="#7da0ff" stroke-width="2"/>
      <text x="44" y="62" fill="#ffffff" font-size="18" font-weight="700">03</text>
      <text x="4" y="94" fill="#ffffff" font-size="18" font-weight="700">CHECK</text>
      <text x="-18" y="200" fill="#b8c1cf" font-size="16">constraints + order</text>
    </g>
    <path d="M710 342H790" stroke="#7da0ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(800,270)">
      <circle cx="72" cy="72" r="72" fill="#171d29" stroke="#52617a" stroke-width="2"/>
      <text x="44" y="62" fill="#7da0ff" font-size="18" font-weight="700">04</text>
      <text x="0" y="94" fill="#f7f8fb" font-size="18" font-weight="700">RUBRIC</text>
      <text x="-18" y="200" fill="#b8c1cf" font-size="16">8 dimensions / 0-100</text>
    </g>
    <path d="M950 342H1030" stroke="#7da0ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(1040,270)">
      <circle cx="72" cy="72" r="72" fill="#171d29" stroke="#52617a" stroke-width="2"/>
      <text x="44" y="62" fill="#7da0ff" font-size="18" font-weight="700">05</text>
      <text x="-8" y="94" fill="#f7f8fb" font-size="18" font-weight="700">FAILURE</text>
      <text x="-18" y="200" fill="#b8c1cf" font-size="16">reason + severity</text>
    </g>
    <path d="M1190 342H1270" stroke="#7da0ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(1280,270)">
      <circle cx="72" cy="72" r="72" fill="#0a8b76" stroke="#20c7a4" stroke-width="2"/>
      <text x="44" y="62" fill="#ffffff" font-size="18" font-weight="700">06</text>
      <text x="-14" y="94" fill="#ffffff" font-size="18" font-weight="700">DECIDE</text>
      <text x="-4" y="200" fill="#b8c1cf" font-size="16">three states</text>
    </g>
    <rect x="160" y="574" width="1280" height="74" fill="#171d29" stroke="#2b3445" stroke-width="2"/>
    <text x="198" y="620" fill="#9daac1" font-size="17">CRITICAL FAILURE</text>
    <text x="440" y="620" fill="#ee6b87" font-size="17" font-weight="700">→ FAIL</text>
    <text x="652" y="620" fill="#9daac1" font-size="17">NO CRITICAL FAILURE + GAP</text>
    <text x="1030" y="620" fill="#ffc34d" font-size="17" font-weight="700">→ PARTIAL</text>
    <text x="1245" y="620" fill="#9daac1" font-size="17">ALL GATES</text>
    <text x="1350" y="620" fill="#20c7a4" font-size="17" font-weight="700">→ PASS</text>
  </g>
  <text x="80" y="812" fill="#9daac1" font-family="Arial, sans-serif" font-size="18">A long answer can still fail at step 03. The report keeps that failure legible.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7da0ff"/></marker></defs>
</svg>

