<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f7f4"/>
  <path d="M80 146H1520M80 742H1520" stroke="#d5d7da" stroke-width="2"/>
  <text x="80" y="82" fill="#2457ff" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">AI EVALUATION BENCHMARK LAB / ARCHITECTURE</text>
  <text x="80" y="124" fill="#111318" font-family="Arial, sans-serif" font-size="42" font-weight="700">A case contract moves through visible gates.</text>
  <text x="80" y="794" fill="#626873" font-family="Arial, sans-serif" font-size="18">Local-first • deterministic fixtures • no API key • every failure remains inspectable</text>
  <g font-family="Arial, sans-serif">
    <text x="120" y="206" fill="#626873" font-size="16" font-weight="700" letter-spacing="3">01 / AUTHORING</text>
    <rect x="120" y="238" width="290" height="162" fill="#ffffff" stroke="#bfc6d2" stroke-width="2"/>
    <rect x="120" y="238" width="8" height="162" fill="#2457ff"/>
    <text x="152" y="285" fill="#111318" font-size="26" font-weight="700">Case contract</text>
    <text x="152" y="322" fill="#626873" font-size="17">prompt.md / case.json</text>
    <text x="152" y="350" fill="#626873" font-size="17">constraints + reference</text>
    <text x="152" y="378" fill="#626873" font-size="17">rubric + failure modes</text>
    <path d="M430 320H510" stroke="#2457ff" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="540" y="206" fill="#626873" font-size="16" font-weight="700" letter-spacing="3">02 / EVALUATION CORE</text>
    <rect x="540" y="238" width="360" height="162" fill="#111318" stroke="#111318" stroke-width="2"/>
    <text x="572" y="285" fill="#ffffff" font-size="26" font-weight="700">Evaluator</text>
    <text x="572" y="322" fill="#b8c1cf" font-size="17">schema loader → safe input</text>
    <text x="572" y="350" fill="#b8c1cf" font-size="17">constraint checker → evidence</text>
    <text x="572" y="378" fill="#7da0ff" font-size="17">rubric engine → decision gate</text>
    <path d="M920 320H1000" stroke="#2457ff" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="1030" y="206" fill="#626873" font-size="16" font-weight="700" letter-spacing="3">03 / REVIEW SURFACE</text>
    <rect x="1030" y="238" width="430" height="162" fill="#ffffff" stroke="#bfc6d2" stroke-width="2"/>
    <rect x="1030" y="238" width="8" height="162" fill="#0a8b76"/>
    <text x="1062" y="285" fill="#111318" font-size="26" font-weight="700">Audit report</text>
    <text x="1062" y="322" fill="#626873" font-size="17">score by dimension</text>
    <text x="1062" y="350" fill="#626873" font-size="17">passed / failed constraints</text>
    <text x="1062" y="378" fill="#0a8b76" font-size="17">PASS / PARTIAL / FAIL</text>

    <text x="120" y="506" fill="#626873" font-size="16" font-weight="700" letter-spacing="3">TRACKS IN THE REPOSITORY</text>
    <g transform="translate(120,548)">
      <rect width="350" height="106" fill="#e7edff" stroke="#cbd6f5" stroke-width="2"/>
      <text x="26" y="40" fill="#2457ff" font-size="18" font-weight="700">COMPLEX INSTRUCTION</text>
      <text x="26" y="72" fill="#626873" font-size="16">12 cases / multi-constraint tasks</text>
    </g>
    <g transform="translate(520,548)">
      <rect width="350" height="106" fill="#e6f4f0" stroke="#b8ddd4" stroke-width="2"/>
      <text x="26" y="40" fill="#0a8b76" font-size="18" font-weight="700">TASK PLANNING</text>
      <text x="26" y="72" fill="#626873" font-size="16">10 cases / dependencies + fallback</text>
    </g>
    <g transform="translate(920,548)">
      <rect width="540" height="106" fill="#fff8df" stroke="#ead9a5" stroke-width="2"/>
      <text x="26" y="40" fill="#976d00" font-size="18" font-weight="700">SEARCH &amp; EVIDENCE</text>
      <text x="26" y="72" fill="#626873" font-size="16">8 cases / authority + freshness + conflict</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457ff"/></marker>
  </defs>
</svg>

